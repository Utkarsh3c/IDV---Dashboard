<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #1e1e1e;
      color: #f0f0f0;
    }
    h2, h3 {
      text-align: center;
      color: #ffffff;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .chart-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #2c2c2c;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      background: transparent;
    }
  </style>
</head>
<body>
  <h2>Dashboard Mockup</h2>
  <div class="chart-grid">
    <div class="chart-container">
      <h3>Weekly Distance</h3>
      <canvas id="weeklyDistance"></canvas>
    </div>
    <div class="chart-container">
      <h3>Rolling 7-Day Distance</h3>
      <canvas id="rollingDistance"></canvas>
    </div>
    <div class="chart-container">
      <h3>Activity Type by Year</h3>
      <canvas id="activityTypeYear"></canvas>
    </div>
    <div class="chart-container">
      <h3>Pace vs Heart Rate</h3>
      <canvas id="paceHR"></canvas>
    </div>
    <div class="chart-container">
      <h3>Activity by Weekday and Hour</h3>
      <canvas id="weekdayHour"></canvas>
    </div>
    <div class="chart-container">
      <h3>Cumulative Distance by Year</h3>
      <canvas id="cumulativeDistance"></canvas>
    </div>
  </div>

  <script>
    let data = [];
    Papa.parse("strava_dashboard_data.csv", {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        data = results.data;
        renderCharts();
      }
    });

    function renderCharts() {
      const types = ["Running", "Biking"];
      const colorMap = {
        "Running": "#4a90e2",
        "Biking": "#e74c3c",
        "Walk": "#f1c40f",
        "Swim": "#1abc9c",
        "Hike": "#9b59b6",
        "Weight Training": "#95a5a6",
        "Workout": "#7f8c8d"
      };

      // 1. Weekly Distance
      const weekTotals = {};
      data.forEach(d => {
        const date = new Date(d["Activity Date"]);
        const key = `${date.getFullYear()}-W${Math.ceil((date.getDate() + 6 - date.getDay()) / 7)}`;
        if (!weekTotals[key]) weekTotals[key] = 0;
        weekTotals[key] += d["Distance"] || 0;
      });
      const weeklyLabels = Object.keys(weekTotals).sort();
      const weeklyData = weeklyLabels.map(k => weekTotals[k]);
      createChart("weeklyDistance", "bar", weeklyLabels, [{ label: "Weekly Distance", data: weeklyData }]);

      // 2. Rolling Distance
      const rollingLabels = data.map(d => d["Activity Date"]);
      const rollingData = data.map(d => d["Rolling 7d Distance"] || 0);
      createChart("rollingDistance", "line", rollingLabels, [{ label: "7-Day Rolling Distance", data: rollingData }]);

      // 3. Activity Type by Year
      const counts = {};
      data.forEach(d => {
        const year = new Date(d["Activity Date"]).getFullYear();
        const type = d["Activity Type"];
        if (!counts[year]) counts[year] = {};
        if (!counts[year][type]) counts[year][type] = 0;
        counts[year][type]++;
      });
      const years = Object.keys(counts).sort();
      const allTypes = Array.from(new Set(data.map(d => d["Activity Type"])));
      const yearTypeData = allTypes.map(type => ({
        label: type,
        data: years.map(y => counts[y][type] || 0),
        backgroundColor: colorMap[type] || "#ccc"
      }));
      createChart("activityTypeYear", "bar", years, yearTypeData);

      // 4. Pace vs Heart Rate
      const hrScatter = data.filter(d => d["Average Heart Rate"] && d["Average Pace (min/km)"]).map(d => ({
        x: d["Average Pace (min/km)"],
        y: d["Average Heart Rate"]
      }));
      createChart("paceHR", "scatter", [], [{ label: "Pace vs HR", data: hrScatter }]);

      // 5. Weekday-Hour Frequency
      const freq = {};
      data.forEach(d => {
        const key = `${d["Weekday"]}-${d["Hour of Day"]}`;
        freq[key] = (freq[key] || 0) + 1;
      });
      const hours = Array.from({ length: 24 }, (_, i) => i.toString());
      const weekdays = [...new Set(data.map(d => d["Weekday"]))];
      const weekdayHourData = weekdays.map(day => ({
        label: day,
        data: hours.map(h => freq[`${day}-${h}`] || 0)
      }));
      createChart("weekdayHour", "bar", hours, weekdayHourData);

      // 6. Cumulative Distance (Stacked Line)
      const cumMap = { Running: [], Biking: [] };
      const cumSum = { Running: 0, Biking: 0 };
      const dateMap = {};
      data.forEach(d => {
        const date = d["Activity Date"];
        const type = d["Activity Type"];
        if (!types.includes(type)) return;
        if (!dateMap[date]) dateMap[date] = { date };
        dateMap[date][type] = (dateMap[date][type] || 0) + (d["Distance"] || 0);
      });
      const sortedDates = Object.keys(dateMap).sort();
      sortedDates.forEach(date => {
        types.forEach(t => {
          cumSum[t] += dateMap[date][t] || 0;
          cumMap[t].push(cumSum[t]);
        });
      });
      const cumData = types.map(t => ({
        label: t,
        data: cumMap[t],
        fill: true,
        borderColor: colorMap[t],
        backgroundColor: colorMap[t] + '88'
      }));
      createChart("cumulativeDistance", "line", sortedDates, cumData, {
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
      });
    }

    function createChart(id, type, labels, datasets, options = {}) {
      const ctx = document.getElementById(id).getContext('2d');
      new Chart(ctx, {
        type,
        data: { labels, datasets },
        options: Object.assign({
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f0f0f0' } } },
          scales: {
            x: { ticks: { color: '#f0f0f0' } },
            y: { ticks: { color: '#f0f0f0' } }
          }
        }, options)
      });
    }
  </script>
</body>
</html>
